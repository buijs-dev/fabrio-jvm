name: Prepare Release

# A `v*` tag on develop opens the pull request from release/<version> to develop (the changelog and the
# next -SNAPSHOT); merging that pull request opens the release pull request from develop to main.
on:
  push:
    tags: [ 'v*' ]
  pull_request:
    types: [ closed ]
    branches: [ develop ]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    uses: buijs-dev/ci-templates/.github/workflows/prepare-release.yml@main
    with:
      root-dir: ${{ vars.ROOT_DIR || '.' }}
