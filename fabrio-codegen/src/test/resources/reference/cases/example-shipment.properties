# The example application examples/shipment: the contract that rialtoExport writes, and the options of
# its fabrioGenerator block. option.sources are the authored roots the legacy generator scans.
contract=inputs/shipment/build/rialto/contract.rialto.yaml
option.sources=inputs/shipment/src/main/kotlin,inputs/shipment/src/main/resources
option.columnsPackage=dev.buijs.fabrio.examples.shipment.schema.columns
option.contractPackage=dev.buijs.fabrio.examples.shipment.contract
option.apiV1.basePath=/v1
option.apiV1.apiPackage=dev.buijs.fabrio.examples.shipment.api.v1
option.apiV1.modelPackage=dev.buijs.fabrio.examples.shipment.api.v1.model
option.apiV1.apiNameSuffix=V1
option.apiV1.modelNameSuffix=V1
option.api.basePath=/v2
option.api.apiPackage=dev.buijs.fabrio.examples.shipment.api.v2
option.api.modelPackage=dev.buijs.fabrio.examples.shipment.api.v2.model
option.api.apiNameSuffix=V2
option.api.modelNameSuffix=V2
